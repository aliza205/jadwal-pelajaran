name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Siapkan proyek
        run: |
          for z in *.zip; do
            [ -e "$z" ] && unzip -q -o "$z" -d proyek
          done
          FILE=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)
          echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

      # Kalau secret kunci rilis sudah diisi: buat APK rilis. Kalau belum: APK debug.
      - name: Siapkan kunci rilis
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "BUILD_TASK=assembleRelease" >> "$GITHUB_ENV"
          else
            echo "BUILD_TASK=assembleDebug" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: cd "$PROJECT_DIR" && gradle "$BUILD_TASK" --no-daemon

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/*/*.apk

      # File pemetaan nama R8: simpan! Dipakai untuk membaca laporan error dari APK rilis
      - name: Simpan mapping R8
        if: env.BUILD_TASK == 'assembleRelease'
        uses: actions/upload-artifact@v4
        with:
          name: mapping
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/mapping/release/mapping.txt
